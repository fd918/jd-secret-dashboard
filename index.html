<!doctype html>
<html lang="zh-CN" data-feature-version="20261014-jd-secret-public-v3"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>密令效果看板</title><meta name="description" content="查看已关注的京东密令效果、订单与每日数据"><link rel="icon" href="favicon.png"><link rel="stylesheet" href="style.css?v=20261014-v5"><link rel="stylesheet" href="./shared-date-range-picker.css"><script defer src="./shared-date-range-picker.js"></script><script type="module" src="app.js?v=20261014-v3"></script></head>
<body><main class="page"><header class="header"><div class="identity"><img src="logo.png" alt="云瞻" width="104" height="44"><span class="separator" aria-hidden="true"></span><div><h1>密令效果看板</h1><p>京东密令 · 推广效果</p></div></div><div class="update"><span id="updatedAt" role="status">尚未加入密令词</span><button class="button" id="refresh" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 6M18 17a7 7 0 0 1-12 1l-2-6"/></svg>刷新数据</button></div></header>
<section class="panel controls"><form id="addForm"><label for="keyword">加入我的密令词</label><div class="input-row"><input id="keyword" type="text" maxlength="100" autocomplete="off" placeholder="输入已分配的密令词" required><button class="button primary" id="addButton" disabled><span aria-hidden="true">＋</span> 加入看板</button></div><small>加入后会保存在当前浏览器，下次打开自动显示。</small></form><div class="range-filter"><span class="field-label">效果时间</span><div class="range-buttons" role="group" aria-label="快捷时间筛选"><button type="button" data-range="today" aria-pressed="false">今日</button><button type="button" data-range="yesterday" aria-pressed="false">昨日</button><button type="button" data-range="last7" aria-pressed="true">近七日</button><button type="button" data-range="month" aria-pressed="false">本月</button></div><button type="button" class="button custom-range" id="customRange" aria-haspopup="dialog" aria-expanded="false">自定义时间</button><span id="rangeText" class="range-text"></span></div></section>
<div id="notice" class="notice" role="status" aria-live="polite" hidden><span id="noticeText"></span><button id="undo" type="button" hidden>撤销</button></div>
<section class="metrics" aria-label="我的密令词效果合计"><article class="panel metric income"><span>预估收入</span><strong data-metric="ygFee">—</strong><small>以京东实际结算为准</small></article><article class="panel metric"><span>有效订单金额</span><strong data-metric="ygGmv">—</strong><small>所选时间内累计金额</small></article><article class="panel metric"><span>有效订单量</span><strong data-metric="orderNum">—</strong><small>已关注密令词合计</small></article><article class="panel metric"><span>点击量</span><strong data-metric="clickNum">—</strong><small id="conversion">订单转化率 —</small></article><article class="panel metric"><span>红包发放量 <em>实时</em></span><strong data-metric="giveNum">—</strong><small>京享红包发放数量</small></article><article class="panel metric"><span>红包使用量 <em>T+1</em></span><strong data-metric="useNum">—</strong><small>今日数据可能尚未更新</small></article></section>
<section class="panel table-panel"><div class="section-head"><h2>我的密令词 <span id="wordCount">0 个</span></h2><span id="tableRange"></span></div><div class="table-scroll"><table><thead><tr><th>密令词</th><th>红包发放量<span>实时</span></th><th>红包使用量<span>T+1</span></th><th>点击量</th><th>有效订单量</th><th>有效订单金额</th><th>预估收入</th><th>操作</th></tr></thead><tbody id="words"><tr><td colspan="8" class="empty"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M9 8h30v32H9zM16 17h16M16 24h12M16 31h8"/></svg><strong>加入密令词，开始查看推广效果</strong><span>在上方输入你的密令词，数据会显示在这里。</span></td></tr></tbody><tfoot id="totals"></tfoot></table></div></section></main>
<dialog id="dailyDialog" aria-labelledby="dailyTitle"><header><div><h2 id="dailyTitle">每日效果明细</h2><p id="dailyRange"></p></div><button type="button" class="button" id="closeDaily" aria-label="关闭每日明细">关闭 ×</button></header><div class="dialog-body"><div class="table-scroll"><table><thead><tr><th>日期</th><th>红包发放量</th><th>红包使用量</th><th>点击量</th><th>有效订单量</th><th>有效订单金额</th><th>预估收入</th></tr></thead><tbody id="dailyRows"></tbody></table></div></div></dialog></body></html>
